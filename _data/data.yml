career-profile:
  title: Career Profile
  tagline: "Tech Lead and Engineering Manager with over 20 years of experience in software development. Specialized in scaling agile teams to deliver high-impact systems using Java and DevOps practices. Based in Klagenfurt, driving innovation in eCommerce, tourism, and public safety technology."
  summary: |
    With over <strong>20 years of experience in software development</strong> (Java, agile, DevOps), I combine <strong>hands-on technical expertise</strong> with <strong>strategic leadership</strong> to deliver <strong>mission-critical systems</strong> across diverse industries, including <strong>eCommerce, tourism, public safety, finance, and telecommunications</strong>.
    {: style="text-align: justify;"}

    <br>
    <strong>Current Role: Head of Development at eurofunk:</strong><br>
    As <strong>Head of Department for eOCS Suite Development</strong>, I lead <strong>24 developers across 3 agile teams</strong> in Klagenfurt and St. Johann im Pongau, driving the development of next-generation emergency communication solutions. My focus is on <strong>eOCS>COM</strong>, the communication module, delivering a seamless web-based interface for control centers to unify dispatch, communication, and monitoring systems.
    I expanded the <strong>Skill Development Program (SDP)</strong> to transition teams from SAFe to flow-based/Kanban methodologies, fostering autonomy and continuous improvement. Additionally, I launched a <strong>cross-training initiative</strong> that transformed 33 frontend engineers into full-stack developers within three months, enabling them to ship production code efficiently.
    {: style="text-align: justify;"}

    <br>
    <strong>Tech Lead & Development Manager at Alturos Destinations (2018–2023):</strong><br>
    As <strong>Tech Lead and Development Manager</strong> for the <strong>Peaksolution™ e-commerce platform</strong>, I managed the <strong>development pipeline across 6 teams with 34 engineers</strong> (on-site and remote in Lviv, Ukraine). My responsibilities included coordinating <strong>B2B, B2C, QA, DWH, MyServices, and Integration teams</strong>, serving as the interface to project and product management. Under my leadership, we delivered <strong>15+ software releases per week</strong> across <strong>25+ installations</strong> in Austria, Germany, Switzerland, France, and Italy.
    Key achievements included introducing a <strong>clean architecture</strong> and a <strong>"Connector Hub"</strong> for seamless integration with <strong>30+ tourism service providers</strong>, as well as developing a <strong>customizable templating engine</strong> for rapid deployment of white-label marketplaces.
    {: style="text-align: justify;"}

    <br>
    <strong>CTO at bidorbuy.co.za (2010–2018):</strong><br>
    As <strong>CTO of bidorbuy.co.za</strong>, Africa’s largest e-commerce marketplace, I <strong>completely restructured IT operations</strong>, transforming a legacy infrastructure of <strong>5 non-redundant servers</strong> (with no monitoring, backups, or DevOps) into a <strong>scalable, high-availability private cloud environment</strong> on a limited budget.
    {: style="text-align: justify;"}

    <br>
    <strong>Freelance Consultant & Architect (2000–2018):</strong><br>
    As a <strong>freelance consultant and contractor</strong>, I provided <strong>IT consulting and architecture guidance</strong> for leading companies:
    {: style="text-align: justify;"}
    <ul style="text-align: justify;">
      <li><strong>Vodacom South Africa (2006–2010):</strong> As <strong>Java/JEE Application & Solution Architect</strong>, I led the design team for Vodacom’s customer channels (12 call centers, 550 retail franchises, 15,000 users). Key contributions included migrating from legacy WebSphere to open-source solutions, implementing SOA initiatives, and establishing a standardized web services gateway.</li>
      <li><strong>First National Bank (2004–2006):</strong> As <strong>Chief Architect</strong>, I resolved stability and performance issues, scaling system capacity from <strong>50 to 1,500 concurrent users</strong> (30x improvement) and designed a fully automated Blade Centre environment.</li>
      <li><strong>VHV Versicherungen (2001–2003):</strong> As <strong>Senior J2EE Architect</strong>, I designed and developed <strong>Max.net</strong>, an insurance web portal with single-sign-on, and implemented a model-view-controller framework and XML-based communication infrastructure.</li>
      <li><strong>Standard Bank (1996–2000):</strong> As <strong>Senior System Analyst/Developer</strong>, I enhanced the OS/2-based client-server application, focusing on <strong>hardware integration using C/C++</strong> (printers, card readers, cheque readers) for 350+ branches, including the <strong>Instant Card Issue system</strong> and a <strong>"plug 'n play" Serial Port Interface</strong>.</li>
    </ul>

    <br>
    <h5 class="container-block-title">What I Strive For:</h5>
    I am a <strong>proactive, experienced technical development manager, mentor, and senior software architect</strong> with a track record of delivering quality solutions quickly in the <strong>IT, financial, telco, e-commerce, and government sectors</strong>. My emphasis is on creating systems based on <strong>sound technical designs</strong>, applying <strong>software engineering principles and patterns</strong>, and using <strong>multiple tools and environments</strong> to achieve the best results. I prefer <strong>open-source solutions</strong> over commercial options and believe in <strong>pragmatism, quality, and usability</strong> as key drivers.
    {: style="text-align: justify;"}

    I thrive in <strong>small, collaborative teams</strong> and prefer a <strong>leading consultative role</strong> with clients and colleagues. Over the last 25 years, I have regularly managed employees and clients as a <strong>consultant, sparring partner, and critic</strong>. I value <strong>honesty, clarity, and a service-oriented, coaching approach</strong>, and believe in reaching goals as a collective while sharing results.
    {: style="text-align: justify;"}

    **PLACEMENT OPPORTUNITIES:** I can add great value to your organization in roles such as <strong>Team Lead/Manager/Executive of Development</strong>. I enjoy hands-on work and often find myself in a <strong>Linux terminal or IDE</strong>.<br>
    <br>Preferred location of employment: <b>Austria - Kärnten / Klagenfurt</b>.
    {: style="text-align: justify;"}

    <a title="Personality Assessment of Gerd Naschenweng" href="https://www.naschenweng.eu/cv/Certificates/2019_GWN-PersonalityAssessment.pdf" target="_blank"><i class="far fa-file-pdf"></i> <b>Download Gerd Naschenweng's Personality Assessment</b></a><br>
    <a title="Karriere.at iPersonic Test (Deutsch)" href="https://www.naschenweng.eu/cv/Certificates/2019_karriere_ipersonic_deutsch.pdf" target="_blank"><i class="far fa-file-pdf"></i> <b>Karriere.at iPersonic Test (Deutsch)</b></a>
    {: style="text-align: justify;"}

